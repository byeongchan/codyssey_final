server.address=127.0.0.1
server.port=8080
prizm.environment=${APP_ENV:development}
prizm.provider=${DATA_PROVIDER:reef-danawa}
prizm.fixtures=${FIXTURE_DIR:../../fixtures}
prizm.catalog-source=${CATALOG_SOURCE:fixture}
prizm.reference-time=${FIXTURE_REFERENCE_TIME:}
prizm.internal-key=${INTERNAL_API_KEY:}
prizm.ai-url=${AI_URL:http://127.0.0.1:8000}
prizm.explanation-provider=${AI_PROVIDER:gemini}
prizm.gemini-model=${GEMINI_MODEL:}
prizm.collector-url=${COLLECTOR_URL:http://127.0.0.1:4001}
prizm.firebase.mode=${FIREBASE_MODE:cloud}
prizm.firebase.project-id=${FIREBASE_PROJECT_ID:}
prizm.alerts.scheduler-enabled=${ALERT_SCHEDULER_ENABLED:false}
prizm.snapshot-alerts.enabled=${SNAPSHOT_ALERT_EVENTS_ENABLED:true}
prizm.operations-uids=${OPERATIONS_UIDS:}
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
prizm.live.search-cache-seconds=${LIVE_SEARCH_CACHE_SECONDS:900}
prizm.live.product-cache-seconds=${LIVE_PRODUCT_CACHE_SECONDS:21600}
prizm.live.offers-cache-seconds=${LIVE_OFFERS_CACHE_SECONDS:300}
prizm.live.refresh-enabled=${LIVE_REFRESH_ENABLED:false}
prizm.live.refresh-millis=${LIVE_REFRESH_MILLIS:21600000}
